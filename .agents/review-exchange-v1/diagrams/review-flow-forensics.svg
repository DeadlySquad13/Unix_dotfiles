"Verdana" font-size="14" lengthAdjust="spacing" textLength="194.0313" x="767.24" y="1979.4907">(dedup/supersession index)</text></g><!--entity Materialized--><g class="entity" data-qualified-name="Sandbox.Materialized" data-source-line="29" id="ent0017"><path d="M1008.53,1921.6988 L1049.53,1921.6988 A3.75,3.75 0 0 1 1052.03,1924.1988 L1059.03,1942.6988 L1285.988,1942.6988 A2.5,2.5 0 0 1 1288.488,1945.1988 L1288.488,1989.7925 A2.5,2.5 0 0 1 1285.988,1992.2925 L1008.53,1992.2925 A2.5,2.5 0 0 1 1006.03,1989.7925 L1006.03,1924.1988 A2.5,2.5 0 0 1 1008.53,1921.6988" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="1006.03" x2="1059.03" y1="1942.6988" y2="1942.6988"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="196" x="1016.03" y="1962.6939">materialized/&lt;messageId&gt;/</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="252.458" x="1016.03" y="1978.9907">(diff.patch, diffstat.txt, commits.txt)</text></g><g class="entity" data-qualified-name="GMN29" data-source-line="46" id="ent0030"><path d="M1373.91,1584.4588 L1373.91,1639.8572 L2006.6082,1639.8572 L2006.6082,1594.4588 L1996.6082,1584.4588 L1373.91,1584.4588" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M1996.6082,1584.4588 L1996.6082,1594.4588 L2006.6082,1594.4588 L1996.6082,1584.4588" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="536.5928" x="1379.91" y="1601.5256">@creamsoda is not necessarily the only producer. A producer can be any agent &#8212;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="611.6982" x="1379.91" y="1616.6585">even one running on the same computer as @salt and @darkGreen-tangerineDream-green &#8212;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="442.0508" x="1379.91" y="1631.7913">as long as it has gitlab/github credentials and git fetch permissions.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="52" id="ent0033"><path d="M11,1335.3088 L11,1481.5041 A0,0 0 0 0 11,1481.5041 L679.5117,1481.5041 A0,0 0 0 0 679.5117,1481.5041 L679.5117,1345.3088 L669.5117,1335.3088 L401.71,1335.3088 L470.25,1234.4287 L393.71,1335.3088 L11,1335.3088 A0,0 0 0 0 11,1335.3088" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M669.5117,1335.3088 L669.5117,1345.3088 L679.5117,1345.3088 L669.5117,1335.3088" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="577.8145" x="17" y="1352.3756">Transport-mount facts (plan v3 &#167;1 facts 10-13 / &#167;2.1): the runtime-home-bridge confirms</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="647.5117" x="17" y="1367.5085">the _state mount (opencodeBase: _state/opencode &#8594; .local/state/opencode under namespaceRoot)</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="626.6597" x="17" y="1382.6413">and @salt's OWN projects (darkGreen-tangerineDream baseForSwitch: shared-/@salt/Projects &#8594;</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="521.4092" x="17" y="1397.7741">Projects, switch-time only). It does NOT expose @creamsoda's synced transport</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="574.2979" x="17" y="1412.9069">(/zsalt/shared-/@creamsoda/Projects/.artifact &#8212; rut-Projects_artifacts, receiveonly): that</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="569.7593" x="17" y="1428.0397">mount is docker-compose-only (docker-compose.darkGreen-tangerineDream-base.yml,</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="437.8105" x="17" y="1443.1725">@tangerineDream repo) and external to the bridge. Shown here as</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="640.0723" x="17" y="1458.3053">/usr/local/darkGreen-/tangerineDream-green/... &#8212; VERIFY the exact @creamsoda-transport mount</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="203.0615" x="17" y="1473.4381">path against that compose file.</text></g><!--link Producer to Worktree--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="33" id="lnk18"><path d="M510.26,195.8887 C510.26,223.4087 510.26,275.3287 510.26,302.0687" fill="none" id="Producer-to-Worktree" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="510.26,308.0687,514.26,299.0687,510.26,303.0687,506.26,299.0687,510.26,308.0687" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="212.8369" x="511.26" y="238.5756">invoke review-exchange capture</text><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="181.1875" x="527.0847" y="253.7085">assemble context_snapshot</text></g><!--link Worktree to LocalSymlink--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="34" id="lnk19"><path d="M503.7,358.3587 C498.69,384.7787 492.8789,436.464 487.5089,464.754" fill="none" id="Worktree-to-LocalSymlink" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="486.39,470.6487,491.9982,462.5526,487.3224,465.7365,484.1386,461.0607,486.39,470.6487" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="13" lengthAdjust="spacing" textLength="127.7339" x="595.7216" y="401.1756">writes package into<