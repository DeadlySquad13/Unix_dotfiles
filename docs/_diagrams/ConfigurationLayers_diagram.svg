<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="429px" preserveAspectRatio="none" style="width:1836px;height:429px;background:#FFFFFF;" version="1.1" viewBox="0 0 1836 429" width="1836px" zoomAndPan="magnify"><title>Layered configuration: inputs, modules, and generated output</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="461.2344" x="680.8563" y="22.9951">Layered configuration: inputs, modules, and generated output</text></g><!--entity modules--><g class="entity" data-qualified-name="modules" data-source-line="3" id="ent0002"><rect fill="#F1F1F1" height="127.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="199.1748" x="101.69" y="44.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="280.8648" y="49.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="278.8648" y="51.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="278.8648" y="55.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.6865" x="116.69" y="77.292">Reusable modules</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.1748" x="116.69" y="93.5889">(options and behavior)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="116.69" y="109.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4541" x="116.69" y="126.1826">Example:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.0234" x="116.69" y="142.4795">options.foo.bar.path</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.2432" x="116.69" y="158.7764">config.services.foo</text></g><!--entity inputs--><g class="entity" data-qualified-name="inputs" data-source-line="4" id="ent0003"><rect fill="#F1F1F1" height="127.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="266.3857" x="752.14" y="178.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="998.5257" y="183.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="996.5257" y="185.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="996.5257" y="189.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.2959" x="767.14" y="211.292">Repository namespace</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.1221" x="767.14" y="227.5889">(user-facing inputs)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="767.14" y="243.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4541" x="767.14" y="260.1826">Example:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="207.2656" x="767.14" y="276.4795">config.ds-omega.foo.bar.path</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="226.3857" x="767.14" y="292.7764">config.ds-omega.hosts.&lt;name&gt;</text></g><!--entity glue--><g class="entity" data-qualified-name="glue" data-source-line="5" id="ent0004"><rect fill="#F1F1F1" height="111.4844" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="388.5645" x="7" y="312.4469"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="375.5645" y="317.4469"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="373.5645" y="319.4469"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="373.5645" y="323.4469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165.2588" x="22" y="345.442">Per-host / per-user glue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.7402" x="22" y="361.7389">(local wiring)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="22" y="378.0357">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4541" x="22" y="394.3326">Example:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="348.5645" x="22" y="410.6295">foo.path = config.sops.templates.\"foo.env\".path</text></g><!--entity processed--><g class="entity" data-qualified-name="processed" data-source-line="6" id="ent0005"><rect fill="#F1F1F1" height="127.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="195.7637" x="1250.1" y="111.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1425.8637" y="116.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1423.8637" y="118.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1423.8637" y="122.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.6797" x="1265.1" y="144.292">Processed program</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.8662" x="1265.1" y="160.5889">configuration</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1265.1" y="176.8857">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4541" x="1265.1" y="193.1826">Example:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.1504" x="1265.1" y="209.4795">programs.foo.settings</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.7637" x="1265.1" y="225.7764">programs.foo.services</text></g><!--entity output--><g class="entity" data-qualified-name="output" data-source-line="7" id="ent0006"><rect fill="#F1F1F1" height="127.7813" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="216.0869" x="1614.86" y="111.2969"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1810.9469" y="116.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1808.9469" y="118.2969"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1808.9469" y="122.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.0869" x="1629.86" y="144.292">Generated files / runtime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="1629.86" y="160.5889">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4541" x="1629.86" y="176.8857">Example:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="56.5742" x="1629.86" y="193.1826">foo.conf</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.0615" x="1629.86" y="209.4795">user systemd unit</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.1016" x="1629.86" y="225.7764">container / service</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="16" id="ent0013"><path d="M641.56,340.9169 L641.56,411.4481 A0,0 0 0 0 641.56,411.4481 L1129.0937,411.4481 A0,0 0 0 0 1129.0937,411.4481 L1129.0937,350.9169 L1119.0937,340.9169 L889.33,340.9169 L885.33,306.3769 L881.33,340.9169 L641.56,340.9169 A0,0 0 0 0 641.56,340.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1119.0937,340.9169 L1119.0937,350.9169 L1129.0937,350.9169 L1119.0937,340.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="466.5337" x="647.56" y="357.9838">Repository namespace means the flake's own namespaced option tree,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.1626" x="647.56" y="373.1166">usually config.&lt;namespace&gt; (for example config.ds-omega).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="364.2666" x="647.56" y="388.2494">It is distinct from standard module namespaces such as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.9951" x="647.56" y="403.3822">programs, services, and home.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="23" id="ent0016"><path d="M69.71,206.9169 L69.71,277.4481 A0,0 0 0 0 69.71,277.4481 L332.8604,277.4481 A0,0 0 0 0 332.8604,277.4481 L332.8604,216.9169 L322.8604,206.9169 L205.28,206.9169 L201.28,172.3769 L197.28,206.9169 L69.71,206.9169 A0,0 0 0 0 69.71,206.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M322.8604,206.9169 L322.8604,216.9169 L332.8604,216.9169 L322.8604,206.9169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.6265" x="75.71" y="223.9838">Generic SOPS contract:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.1504" x="75.71" y="239.1166">docs/adr/0008-sops-secrets-layer.md</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.6411" x="75.71" y="254.2494">Concrete SOPS/OpenCode example:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.5078" x="75.71" y="269.3822">docs/adr/0009-sops-opencode.md</text></g><!--link modules to inputs--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="9" id="lnk7"><path d="M301.09,127.5969 C419.88,150.9369 613.8125,189.0402 745.9025,214.9902" fill="none" id="modules-to-inputs" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="751.79,216.1469,743.7299,210.487,746.8838,215.183,742.1877,218.3369,751.79,216.1469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.8755" x="426.56" y="151.4238">declare / consume contracts</text></g><!--link glue to inputs--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="10" id="lnk8"><path d="M395.91,332.4169 C509.72,311.3869 644.7698,286.4368 745.9498,267.7468" fill="none" id="glue-to-inputs" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="751.85,266.6569,742.2731,264.3582,746.9332,267.5651,743.7263,272.2252,751.85,266.6569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.6587" x="457.06" y="289.9638">supply local values</text></g><!--link modules to processed--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="11" id="lnk9"><path d="M301.12,113.3269 C384.02,117.6769 505.53,124.1569 611.56,130.1869 C841.62,143.2569 899.11,146.9069 1129.1,16