<?plantuml 1.2026.1?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="640px" preserveAspectRatio="none" style="width:3675px;height:640px;background:#FFFFFF;" version="1.1" viewBox="0 0 3675 640" width="3675px" zoomAndPan="magnify"><title>C4 (container) &#8212; boundaries between Unix_dotfiles MCP module and logseq-mcp</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="597.9873" x="1531.5313" y="22.9951">C4 (container) &#8212; boundaries between Unix_dotfiles MCP module and logseq-mcp</text></g><!--cluster Unix_dotfiles ? Nix configuration\n(source of truth; derives, never hand-writes)--><g class="cluster" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes." data-source-line="16" id="ent0002"><path d="M121.05,167.1869 L403.9211,167.1869 A3.75,3.75 0 0 1 406.4211,169.6869 L413.4211,201.1244 L1650.31,201.1244 A2.5,2.5 0 0 1 1652.81,203.6244 L1652.81,414.6869 A2.5,2.5 0 0 1 1650.31,417.1869 L121.05,417.1869 A2.5,2.5 0 0 1 118.55,414.6869 L118.55,169.6869 A2.5,2.5 0 0 1 121.05,167.1869" fill="#EEF6FD" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="118.55" x2="413.4211" y1="201.1244" y2="201.1244"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="210.7207" x="158.1252" y="180.3255">Unix_dotfiles &#8212; Nix configuration</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="281.8711" x="122.55" y="194.2943">(source of truth; derives, never hand-writes)</text></g><!--cluster logseq-mcp fork ? per-agent MCP gateway\n(one container per agent profile)--><g class="cluster" data-qualified-name="logseq-mcp fork . per-agent MCP gateway.n.one container per agent profile." data-source-line="33" id="ent0013"><path d="M2076.69,310.1869 L2350.9654,310.1869 A3.75,3.75 0 0 1 2353.4654,312.6869 L2360.4654,344.1244 L3665.55,344.1244 A2.5,2.5 0 0 1 3668.05,346.6244 L3668.05,447.6869 A2.5,2.5 0 0 1 3665.55,450.1869 L2076.69,450.1869 A2.5,2.5 0 0 1 2074.19,447.6869 L2074.19,312.6869 A2.5,2.5 0 0 1 2076.69,310.1869" fill="#FBEBFC" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="2074.19" x2="2360.4654" y1="344.1244" y2="344.1244"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="273.2754" x="2078.19" y="323.3255">logseq-mcp fork &#8212; per-agent MCP gateway</text><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="207.4512" x="2111.1021" y="337.2943">(one container per agent profile)</text></g><!--entity profiles--><g class="entity" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes..profiles" data-source-line="17" id="ent0003"><rect fill="#438DD5" height="75.875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="287.1992" x="134.55" y="310.2469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.1504" x="144.55" y="331.3855">logseq-profiles.nix</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.1992" x="144.55" y="345.3543">GLOBAL namespace ACL values (mkDefault)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.9551" x="144.55" y="359.323">shared &#183; sets &#183; agentProfiles &#183;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.6484" x="144.55" y="373.2918">summarizerProfiles &#183; logseqSrc</text></g><!--entity mcpnix--><g class="entity" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes..mcpnix" data-source-line="18" id="ent0004"><rect fill="#438DD5" height="89.8438" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="248.9785" x="814.87" y="269.2669"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="47.7598" x="824.87" y="290.4055">mcp.nix</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.6328" x="824.87" y="304.3743">options + derivation:</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.9785" x="824.87" y="318.343">per-agent servers &#183; opencode settings</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.293" x="824.87" y="332.3118">(agent personas, tools globs,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.4395" x="824.87" y="346.2805">permission.task) &#183; compose endpoints</text></g><!--entity glue--><g class="entity" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes..glue" data-source-line="19" id="ent0005"><rect fill="#438DD5" height="61.9063" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="280.7891" x="137.76" y="213.2269"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="55.6582" x="147.76" y="234.3655">host glue</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.0371" x="147.76" y="248.3343">homes/&#8230;/sops-opencode</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="260.7891" x="147.76" y="262.303">logseqEnvironmentFile (SOPS) &#183; logseqHost</text></g><!--entity compose--><g class="entity" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes..compose" data-source-line="20" id="ent0006"><rect fill="#438DD5" height="47.9375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="147.002" x="1434.85" y="334.2169"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="102.7852" x="1444.85" y="355.3555">lib/mcp-compose</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.002" x="1444.85" y="369.3243">pure YAML generator</text></g><!--entity check--><g class="entity" data-qualified-name="Unix_dotfiles . Nix configuration.n.source of truth. derives. never hand-writes..check" data-source-line="21" id="ent0007"><rect fill="#438DD5" height="61.9063" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="256.918" x="1379.89" y="229.2269"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.207" x="1389.89" y="250.3655">checks/mcp-logseq</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.7051" x="1389.89" y="264.3343">static oracle</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.918" x="1389.89" y="278.303">(nix build .#checks.&lt;sys&gt;.mcp-logseq)</text></g><!--entity gw--><g class="entity" data-qualified-name="logseq-mcp fork . per-agent MCP gateway.n.one container per agent profile..gw" data-source-line="34" id="ent0014"><rect fill="#A74FE0" height="47.9375" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="258.7051" x="2090.19" y="375.2169"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="85.1191" x="2100.19" y="396.3555">supergateway</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.7051" x="2100.19" y="410.3243">(supercorp/supergateway:uvx &#8212; no git)</text></g><!--entity mcp--><g class="entity" data-qualified-name="logseq-mcp fork . per-agent MCP gateway.n.one container per agent profile..mcp" data-source-line="35" id="ent0015"><rect fill="#A74FE0" height="75.875" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="294.0137" x="2820.16" y="357.2469"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.9707" x="2830.16" y="378.3855">mcp-logseq process</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.1797" x="2830.16" y="392.3543">config.py (env loaders) &#183;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="257.7598" x="2830.16" y="406.323">access.py (namespace+tag+block gates) &#183;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="274.0137" x="2830.16" y="420.2918">namespace.py (matching + personal marker)</text></g><!--entity logseq--><g class="entity" data-qualified-name="logseq-mcp fork . per-agent MCP gateway.n.one container per agent profile..logseq" data-source-line="36" id="ent0016"><path d="M3466.1,369.7269 C3466.1,359.7269 3559.0775,359.7269 3559.0775,359.7269 C3559.0775,359.7269 3652.0551,359.7269 3652.0551,369.7269 L3652.0551,420.6331 C3652.0551,430.6331 3559.0775,430.6331 3559.0775,430.6331 C3559.0775,430.6331 3466.1,430.6331 3466.1,420.6331 L3466.1,369.7269" fill="#999999" style="stroke:#181818;stroke-width:0.5;"/><path d="M3466.1,369.7269 C3466.1,379.7269 3559.0775,379.7269 3559.0775,379.7269 C3559.0775,379.7269 3652.0551,379.7269 3652.0551,369.7269" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="116.0977" x="3476.1" y="394.8655">Logseq app / graph</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.9551" x="3476.1" y="408.8343">http://&lt;logseqHost&gt;:12315</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="119.4785" x="3476.1" y="422.803">(/kbn shared graph)</text></g><g class="entity" data-qualified-name="GMN21" data-source-line="59" id="ent0022"><path d="M1976.99,466.2169 L1976.99,504.1544 A0,0 0 0 0 1976.99,504.1544 L2462.1052,504.1544 A0,0 0 0 0 2462.1052,504.1544 L2462.1052,476.2169 L2452.1052,466.2169 L2223.55,466.2169 L2219.55,423.4669 L2215.55,466.2169 L1976.99,466.2169 A0,0 0 0 0 1976.99,466.2169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2452.1052,466.2169 L2452.1052,476.2169 L2462.1052,476.2169 L2452.1052,466.2169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="464.1152" x="1982.99" y="482.3555">ACL is enforced at the PROCESS level (env), because OpenCode's permission</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="438.7383" x="1982.99" y="496.3243">model is tool-name patterns and cannot express namespace granularity.</text></g><g class="entity" data-qualified-name="GMN24" data-source-line="64" id="ent0025"><path d="M34.44,43.2969 L34.44,151.0781 L521.8755,151.0781 L521.8755,53.2969 L511.8755,43.2969 L34.44,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M511.8755,43.2969 L511.8755,53.2969 L521.8755,53.2969 L511.8755,43.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="441.668" x="40.44" y="59.4355">"personal" is DERIVED, never enumerated: the reserved allow-list marker</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="466.4355" x="40.44" y="73.4043">`personal` matches every page, and `exclude_namespaces` = other profiles'</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="465.8438" x="40.44" y="87.373">own + unreferenced bundles (computed by mcp.nix) turns it into "everything</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="409.2832" x="40.44" y="101.3418">outside the agent-defined world". A marker without excludes grants</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="428.8301" x="40.44" y="115.3105">everything &#8212; except the `readAllNamespaces` profile (kbn only) which</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="392.4902" x="40.44" y="129.2793">deliberately reads the whole graph with personal + NO excludes.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="423.3867" x="40.44" y="143.248">Delivery agents (plan/build/nix-plan/nix-build/verifier) have NO profile.</text></g><g class="entity" data-qualified-name="GMN27" data-source-line="74" id="ent0028"><path d="M2706.24,158.3269 L2706.24,294.0456 A0,0 0 0 0 2706.24,294.0456 L2963.17,294.0456 L2967.17,356.8969 L2971.17,294.0456 L3228.0935,294.0456 A0,0 0 0 0 3228.0935,294.0456 L3228.0935,168.3269 L3218.0935,158.3269 L2706.24,158.3269 A0,0 0 0 0 2706.24,158.3269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3218.0935,158.3269 L3218.0935,168.3269 L3228.0935,168.3269 L3218.0935,158.3269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="377.9648" x="2712.24" y="174.4655">./ read = include &#8746; write ("read extends write"); writes gate on</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="423.3457" x="2723.6834" y="188.4343">write_includes (fallback include_namespaces); excludes apply to both.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="401.1914" x="2712.24" y="202.403">./ delegation is permission.task deny-by-default ({ "*-kbn" = deny,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="464.4023" x="2723.6834" y="216.3718">"&lt;parent&gt;-kbn" = allow }) &#8212; last-match-wins; an unlisted subagent is "ask";</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="424.002" x="2723.6834" y="230.3405">the task tool only hides deny. `tools` is deprecated upstream but kept</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.2227" x="2723.6834" y="244.3093">here for MCP glob grants.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="416.1973" x="2712.24" y="258.278">./ rename_page write-gates BOTH names -&gt; approval is COPY-based.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="500.8535" x="2712.24" y="272.2468">./ knowledge roles each get a &lt;parent&gt;-kbn summarizer (logseq-summ-&lt;parent&gt;)</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.3535" x="2723.6834" y="286.2155">that journals "Updated</text><a href="page" target="_top" title="page" xlink:actuate="onRequest" xlink:href="page" xlink:show="new" xlink:title="page" xlink:type="simple"><text fill="#0000FF" font-family="sans-serif" font-size="12" lengthAdjust="spacing" text-decoration="underline" textLength="29.9707" x="2863.8513" y="286.2155">page</text></a><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.9609" x="2893.822" y="286.2155">" entries into &lt;parent-own&gt;/_journals.</text></g><g class="entity" data-qualified-name="GMN30" data-source-line="86" id="ent0031"><path d="M1968.85,172.3069 L1968.85,294.0569 A0,0 0 0 0 1968.85,294.0569 L2215.55,294.0569 L2219.55,374.8669 L2223.55,294.0569 L2470.2426,294.0569 A0,0 0 0 0 2470.2426,294.0569 L2470.2426,182.3069 L2460.2426,172.3069 L1968.85,172.3069 A0,0 0 0 0 1968.85,172.3069" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2460.2426,172.3069 L2460.2426,182.3069 L2470.2426,182.3069 L2460.2426,172.3069" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="421.7871" x="1974.85" y="188.4455">The :uvx image has NO git -&gt; a git+https spec fails at container start.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="443.9473" x="1974.85" y="202.4143">Fix: flake input `mcp-logseq` pinned (flake=false, rev aa5550e&#8230;), source</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="316.8223" x="1974.85" y="216.383">mounted read-only, installed via `uvx --from &lt;dir&gt;`.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="480.3926" x="1974.85" y="230.3518">`logseq-mcpo` stays registered for NON-opencode consumers but is disabled in</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="376.8457" x="1974.85" y="244.3205">OpenCode only (settings.mcp."logseq-mcpo".enabled = false).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="457.9688" x="1974.85" y="258.2893">Host ports are gateway ports; every instance talks to the SAME Logseq app.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="464.4023" x="1974.85" y="272.258">After any wiring change: `make switch` then `make mcp-restart` BEFORE an</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="341.6836" x="1974.85" y="286.2268">OpenCode session (tools are registered at session start).</text></g><!--link profiles to mcpnix--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M421.99,342.6869 C523.31,338.5369 662.48,332.3569 784.87,325.1869 C794.47,324.6269 798.4227,324.3864 808.4127,323.7364" fill="none" id="profiles-to-mcpnix" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="814.4,323.3469,805.1593,319.9397,809.4106,323.6715,805.6787,327.9228,814.4,323.3469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.3281" x="616.0165" y="308.3255">mkDefault values</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.6211" x="552.87" y="322.2943">(shared/sets/profiles/summ/logseqSrc)</text></g><!--link glue to mcpnix--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk9"><path d="M418.87,255.6369 C520.52,264.4169 661.39,277.4869 784.87,292.1869 C794.5,293.3269 798.5016,293.8017 808.5016,295.1217" fill="none" id="glue-to-mcpnix" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="814.45,295.9069,806.0509,290.7635,809.493,295.2526,805.0039,298.6947,814.45,295.9069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="109.1191" x="613.87" y="265.8755">per-host glue only</text></g><!--link mcpnix to compose--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="25" id="lnk10"><path d="M1053.17,359.5069 C1066.7,363.4669 1080.46,366.8569 1093.85,369.1869 C1211.83,389.6869 1345.5936,379.5288 1428.6836,369.4588" fill="none" id="mcpnix-to-compose" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7