4.7669 L1978.1952,741.7044 C1978.1952,751.7044 1905.6376,751.7044 1905.6376,751.7044 C1905.6376,751.7044 1833.08,751.7044 1833.08,741.7044 L1833.08,704.7669" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M1833.08,704.7669 C1833.08,714.7669 1905.6376,714.7669 1905.6376,714.7669 C1905.6376,714.7669 1978.1952,714.7669 1978.1952,704.7669" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="81.8379" x="1843.08" y="729.9055">Logseq graph</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.1152" x="1843.08" y="743.8743">(pages/namespaces)</text></g><!--entity summ_inst--><g class="entity" data-qualified-name="summ_inst" data-source-line="104" id="ent0076"><path d="M1321.7,1435.7969 L1403.2078,1435.7969 A3.75,3.75 0 0 1 1405.7078,1438.2969 L1412.7078,1455.7656 L1585.6219,1455.7656 A2.5,2.5 0 0 1 1588.1219,1458.2656 L1588.1219,1512.1719 A2.5,2.5 0 0 1 1585.6219,1514.6719 L1321.7,1514.6719 A2.5,2.5 0 0 1 1319.2,1512.1719 L1319.2,1438.2969 A2.5,2.5 0 0 1 1321.7,1435.7969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#181818;stroke-width:0.5;" x1="1319.2" x2="1412.7078" y1="1455.7656" y2="1455.7656"/><text fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="68.5078" x="1329.2" y="1449.9355">summ_inst</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.0508" x="1345.6355" y="1473.9043">logseq-summ-&lt;parent&gt; instances</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.9219" x="1329.2" y="1487.873">(narrow: write &lt;parent-own&gt;/_journals,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.0156" x="1380.1531" y="1501.8418">read the parent's own)</text></g><g class="entity" data-qualified-name="GMN108" data-source-line="143" id="ent0109"><path d="M1649.12,786.3469 L1649.12,894.1281 A0,0 0 0 0 1649.12,894.1281 L2162.1552,894.1281 A0,0 0 0 0 2162.1552,894.1281 L2162.1552,796.3469 L2152.1552,786.3469 L1909.64,786.3469 L1905.64,752.0969 L1901.64,786.3469 L1649.12,786.3469 A0,0 0 0 0 1649.12,786.3469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2152.1552,786.3469 L2152.1552,796.3469 L2162.1552,796.3469 L2152.1552,786.3469" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="356.9414" x="1655.12" y="802.4855">Every instance is a client of the SAME Logseq app; the host</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="409.3418" x="1655.12" y="816.4543">ports are gateway ports, not Logseq instances. The per-process env</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="472.8223" x="1655.12" y="830.423">(LOGSEQ_WRITE_INCLUDES/INCLUDE/EXCLUDE) is the hard namespace ACL &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="388.9863" x="1655.12" y="844.3918">OpenCode's tool-permission model cannot express namespaces.</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="492.0352" x="1655.12" y="858.3605">"personal" = the derived complement (reserved marker + exclude_namespaces);</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="461.0508" x="1655.12" y="872.3293">kbn is the one `readAllNamespaces` profile (personal marker, NO excludes).</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="408.9082" x="1655.12" y="886.298">Delivery agents never mount Logseq tools/namespaces/credentials.</text></g><!--reverse