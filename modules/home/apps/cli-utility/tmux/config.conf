# Lines 0–9 → 0–9 (numbers)
# Lines 10–29 → the 20 safe uppercase letters A B C D E F G I J K L P Q R S U V W Y Z (skipping the reserved H, M, N, O, T, X)
bind-key w choose-tree -Zw -K '#{?#{e|==:#{line},0},0,}#{?#{e|==:#{line},1},1,}#{?#{e|==:#{line},2},2,}#{?#{e|==:#{line},3},3,}#{?#{e|==:#{line},4},4,}#{?#{e|==:#{line},5},5,}#{?#{e|==:#{line},6},6,}#{?#{e|==:#{line},7},7,}#{?#{e|==:#{line},8},8,}#{?#{e|==:#{line},9},9,}#{?#{e|==:#{line},10},A,}#{?#{e|==:#{line},11},B,}#{?#{e|==:#{line},12},C,}#{?#{e|==:#{line},13},D,}#{?#{e|==:#{line},14},E,}#{?#{e|==:#{line},15},F,}#{?#{e|==:#{line},16},G,}#{?#{e|==:#{line},17},I,}#{?#{e|==:#{line},18},J,}#{?#{e|==:#{line},19},K,}#{?#{e|==:#{line},20},L,}#{?#{e|==:#{line},21},P,}#{?#{e|==:#{line},22},Q,}#{?#{e|==:#{line},23},R,}#{?#{e|==:#{line},24},S,}#{?#{e|==:#{line},25},U,}#{?#{e|==:#{line},26},V,}#{?#{e|==:#{line},27},W,}#{?#{e|==:#{line},28},Y,}#{?#{e|==:#{line},29},Z,}'

