# harpoon bookmark keybindings.
#
# Sourced from the generated tmux.conf only when harpoon is enabled: the Nix
# module (modules/home/apps/cli-utility/tmux/default.nix) emits the `source-file`
# line behind an `if-shell -F` guard on `@harpoon_loaded`, so it is a no-op in
# tmux servers where the plugin did not run.
#
# Reference: https://github.com/Chaitanyabsprip/tmux-harpoon

# Unbinds "Jump to specific tmux window", it's used when there're more than 10
# windows opened
unbind "'"

#  yarn link @dsomega-boostrap/projen && yarn projen Add marks on `m` like in NeoVim
bind M-m run 'harpoon -a' # Track current current tmux session
bind M run 'harpoon -A' # Track (add) current pane within current tmux session
bind "'" run 'harpoon -l' # List all marks
bind I run 'harpoon -e' # Edit list in $EDITOR

# 7 is uncomfortable with our prefix. 0 is occupied.
bind q run 'harpoon -s 1'  # jump to bookmark at index 1
bind M-q run 'harpoon -r 1'  # replace entry at index 1 with current session
bind '"' run 'harpoon -s 2'  # jump to bookmark at index 2
bind 'M-"' run 'harpoon -r 2'  # replace entry at index 2 with current session
bind 8 run 'harpoon -s 3'  # jump to bookmark at index 3
bind M-8 run 'harpoon -r 3'  # replace entry at index 3 with current session
bind 9 run 'harpoon -s 4'  # jump to bookmark at index 4
bind M-9 run 'harpoon -r 4'  # replace entry at index 4 with current session

# vi:ft=tmux
