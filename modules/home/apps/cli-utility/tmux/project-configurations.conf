# ---------------------------------------------------------------------------
# tmux keybinding: pick smug project configurations and their windows with
# fzf in a popup, then start a smug session per configuration.
#
# Requires tmux 3.2+ (display-popup). The -T title flag requires tmux 3.3+;
# drop it if you are on 3.2.
#
# Load it with:
#     source-file /path/to/Tmux/project-configurations.tmux.conf
# or add that line to your ~/.config/tmux/tmux.conf.
#
# Then press:  Prefix + e
#
# The popup runs `invoke projects.select-project-configuration-with-fzf`,
# a thin wrapper over `smug.select-project-configuration-with-fzf`, which:
#   * lists the project configurations under the smug root and lets you pick
#     one or more with fzf (preview: the first lines of the session YAML),
#   * lists every `config:window` of the selection and lets you pick windows,
#     pre-selecting each file's custom `default_windows` key (or every window
#     when that key is absent),
#   * starts a smug session per configuration with the chosen windows.
#
# In the window list, Ctrl-B steps back keeping the previous configuration
# choice pre-selected, while Esc steps back and clears it (a quick re-pick).
# Esc in the configuration list cancels the popup; Ctrl-C aborts from either
# stage.
# `-E` closes the popup automatically as soon as the command exits, so it
# disappears the moment you accept (or cancel) the fzf selection.
# ---------------------------------------------------------------------------

# Directory that contains tasks.py / smug.py (the invoke project root).
# It is taken from the PROJECTS_PROJECT_DIR environment variable. Export it
# before starting the tmux server to override the fallback, e.g.:
#
#     export PROJECTS_PROJECT_DIR="$HOME/path/to/scripts"
#
# Otherwise the default path below is used.
bind-key e display-popup -E -w 80% -h 60% -T ' projects: select project configuration, start smug sessions ' 'invoke --search-root="${PROJECTS_PROJECT_DIR:-$HOME/.bookmarks/shared-scripts}" projects.select-project-configuration-with-fzf'

# If `invoke` is not on the PATH the tmux server sees (e.g. it is only set up
# in an interactive/login shell), route through a login shell instead:
#
# bind-key e display-popup -E -w 80% -h 60% -T ' projects: select project configuration, start smug sessions ' 'bash -lc "invoke --search-root=\"${PROJECTS_PROJECT_DIR:-/shared/archive-resources-/Shared/_scripts}\" projects.select-project-configuration-with-fzf"'

# vi:ft=tmux
