# ---------------------------------------------------------------------------
# tmux keybinding: pick a git repository (frecency-ranked from zoxide) with
# fzf in a popup, then open it in a new tmux session.
#
# Requires tmux 3.2+ (display-popup). The -T title flag requires tmux 3.3+;
# drop it if you are on 3.2.
#
# Load it with:
#     source-file /path/to/Tmux/projects.tmux.conf
# or add that line to your ~/.config/tmux/tmux.conf.
#
# Then press:  Prefix + E
#
# The popup runs `invoke projects.select-with-fzf-tmux`, which:
#   * reads zoxide's database directly and ranks git roots by frecency,
#   * lets you pick one with fzf,
#   * opens (or reuses) a tmux session rooted at the selected repository
#     via the reusable `_features/packages/tmux` library.
# `-E` closes the popup automatically as soon as the command exits, so it
# disappears the moment you accept (or cancel) the fzf selection.
# ---------------------------------------------------------------------------

# Directory that contains tasks.py / projects.py (the invoke project root).
# The `projects` and `smug` collections live in the SAME project, so this
# points at the same place `smug.conf` uses.
#
# It is taken from the PROJECTS_PROJECT_DIR environment variable. Export it
# before starting the tmux server to override the fallback, e.g.:
#
#     export PROJECTS_PROJECT_DIR="$HOME/path/to/scripts"
#
# Otherwise the default path below is used.
bind-key E display-popup -E -w 80% -h 60% -T ' projects: select repo, open in tmux ' 'invoke --search-root="${PROJECTS_PROJECT_DIR:-$HOME/.bookmarks/shared-scripts}" projects.select-with-fzf-tmux'

# If `invoke` is not on the PATH the tmux server sees (e.g. it is only set up
# in an interactive/login shell), route through a login shell instead:
#
# bind-key E display-popup -E -w 80% -h 60% -T ' projects: select repo, open in tmux ' 'bash -lc "cd \"${PROJECTS_PROJECT_DIR:-/shared/archive-resources-/Shared/_scripts}\" && invoke projects.select-with-fzf-tmux"'

# vi:ft=tmux
