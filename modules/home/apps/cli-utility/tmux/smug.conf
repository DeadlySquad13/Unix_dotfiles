# ---------------------------------------------------------------------------
# tmux keybinding: start the current session through smug, choosing windows
# with fzf in a popup.
#
# Requires tmux 3.2+ (display-popup). The -T title flag requires tmux 3.3+;
# drop it if you are on 3.2.
#
# Load it with:
#     source-file /path/to/Tmux/smug.tmux.conf
# or add that line to your ~/.config/tmux/tmux.conf.
#
# Then press:  Prefix + W
#
# The popup runs `invoke smug.start-current`, which:
#   * resolves the smug session matching the current tmux session,
#   * lets you pick windows with fzf (with a bat-highlighted YAML preview),
#   * starts/attaches to that session.
# `-E` closes the popup automatically as soon as the command exits, so it
# disappears the moment you accept (or cancel) the fzf selection.
# ---------------------------------------------------------------------------

# Directory that contains tasks.py / smug.py (the invoke project root).
#
# It is taken from the SMUG_PROJECT_DIR environment variable. Export it
# before starting the tmux server to override the fallback, e.g.:
#
#     export SMUG_PROJECT_DIR="$HOME/path/to/scripts"
#
# Otherwise the default path below is used.
bind-key W display-popup -E -w 80% -h 60% -T ' smug: start current session ' 'invoke --search-root="${SMUG_PROJECT_DIR:-$HOME/.bookmarks/shared-scripts}" smug.start-current'

# If `invoke` is not on the PATH the tmux server sees (e.g. it is only set up
# in an interactive/login shell), route through a login shell instead:
#
# bind-key W display-popup -E -w 80% -h 60% -T ' smug: start current session ' 'bash -lc "cd \"${SMUG_PROJECT_DIR:-/shared/archive-resources-/Shared/_scripts}\" && invoke smug.start-current"'
